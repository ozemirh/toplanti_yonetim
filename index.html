<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B2B Toplantı Yönetim Sistemi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /*
      TASARIM SİSTEMİ
    */
    :root {
      --bg: #F3F5F9;
      --bg-glow: radial-gradient(circle at 50% -10%, rgba(59, 91, 219, 0.06), transparent 40%);
      --card: #FFFFFF;
      --card-alt: #F7F9FC;
      --header: #EEF1F7;
      --ink: #1B2230;
      --blue: #3457D5;
      --blue-dim: #23408F;
      --green: #1E9E5A;
      --yellow: #B5790E;
      --red: #D93A3A;
      --white: #1B2230;
      --gray: #626D82;
      --gray-dim: #8892A3;
      --border: #DDE3ED;
      --border-soft: #E6EAF2;
      --cell: #FFFFFF;
      --snap: rgba(52, 87, 213, 0.05);

      --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
      --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      background: var(--bg-glow), var(--bg);
      background-attachment: fixed;
      color: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font-family: inherit; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 10px 13px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      color: var(--white);
      background: var(--blue);
      transition: transform 0.08s ease, filter 0.12s ease, opacity 0.08s ease, box-shadow 0.12s ease;
      white-space: nowrap;
      box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset;
    }

    button:hover { filter: brightness(1.12); box-shadow: 0 4px 14px rgba(91, 124, 255, 0.28), 0 1px 0 rgba(255,255,255,0.08) inset; }
    button:active { transform: translateY(1px); filter: brightness(0.98); }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    button.secondary { background: var(--header); border: 1px solid var(--border); box-shadow: none; }
    button.secondary:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
    button.green { background: var(--green); color: #052014; }
    button.green:hover { box-shadow: 0 4px 14px rgba(63, 217, 138, 0.28); }
    button.yellow { background: var(--yellow); color: #1d1204; }
    button.yellow:hover { box-shadow: 0 4px 14px rgba(228, 169, 59, 0.28); }
    button.red { background: var(--red); color: #200404; }
    button.red:hover { box-shadow: 0 4px 14px rgba(255, 93, 93, 0.28); }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--gray); box-shadow: none; }
    button.ghost:hover { color: var(--white); border-color: var(--gray-dim); box-shadow: none; }
    button.small { padding: 4px 6px; font-size: 10.5px; border-radius: 6px; line-height: 1; }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 11px;
      background: var(--cell);
      color: var(--white);
      font-size: 14px;
      outline: none;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }

    textarea { resize: vertical; min-height: 92px; font-family: var(--font-mono); font-size: 12.5px; }
    input:focus, textarea:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(91, 124, 255, 0.18);
    }
    
    input[type="color"] { padding: 2px; height: 38px; cursor: pointer; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--gray-dim);
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .app-shell {
      width: min(1760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .topbar h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(22px, 2.4vw, 32px);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }
    .top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    .control-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 400px;
      gap: 16px;
      align-items: start;
    }

    .left-column { display: grid; gap: 14px; min-width: 0; }

    .panel {
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 12px 32px rgba(27, 34, 48, 0.08);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 13px 16px;
      background: var(--header);
      border-bottom: 1px solid var(--border-soft);
    }

    .panel-header h2, .panel-header h3 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 16.5px;
      letter-spacing: -0.005em;
    }
    .panel-header span {
      color: var(--gray-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.02em;
    }
    
    .panel-header-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex: 1;
    }
    
    .panel-body { padding: 15px; }

    .hall-canvas-wrap { padding: 14px; }

    .hall-canvas {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 520px;
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      overflow: hidden;
      background:
        repeating-linear-gradient(0deg, transparent 0, transparent calc(5% - 1px), var(--snap) calc(5% - 1px), var(--snap) 5%),
        repeating-linear-gradient(90deg, transparent 0, transparent calc(5% - 1px), var(--snap) calc(5% - 1px), var(--snap) 5%),
        radial-gradient(circle at 50% 0%, rgba(52, 87, 213, 0.06), transparent 34%),
        #FBFCFE;
      user-select: none;
      touch-action: none;
    }

    .hall-canvas.follow {
      min-height: auto;
      height: min(92vh, 56.25vw);
      max-height: calc(100vh - 54px);
      aspect-ratio: 16 / 9;
      margin: 0 auto;
      border-radius: 0;
      border-color: var(--border-soft);
      background:
        radial-gradient(circle at 50% 0%, rgba(52, 87, 213, 0.07), transparent 34%),
        #FFFFFF;
    }

    .hall-canvas.edit-active {
      outline: 3px dashed var(--blue);
      outline-offset: -3px;
    }

    .door-sketch {
      position: absolute;
      left: -1px;
      width: 5.2%;
      height: 7.4%;
      border: 1.5px dashed rgba(181, 121, 14, 0.65);
      border-left: 0;
      border-radius: 0 8px 8px 0;
      background: rgba(181, 121, 14, 0.07);
      color: rgba(27, 34, 48, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(8px, 0.8vw, 12px);
      font-weight: 900;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    .door-sketch.door-1 { top: 29%; }
    .door-sketch.door-2 { top: 64%; }

    .layout-item {
      position: absolute;
      display: grid;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #FFFFFF;
      box-shadow: 0 10px 26px rgba(27, 34, 48, 0.10);
      color: var(--white);
      cursor: grab;
      isolation: isolate;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
      container-type: size;
      container-name: table-item;
    }

    .layout-item:active { cursor: grabbing; }
    .layout-item:not(.follow-readonly):hover { border-color: var(--gray-dim); }
    .layout-item.selected { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(52, 87, 213, 0.16), 0 10px 26px rgba(27, 34, 48, 0.10); }
    .layout-item.drop-ready { border-color: var(--yellow); box-shadow: 0 0 0 4px rgba(181, 121, 14, 0.16), 0 10px 26px rgba(27, 34, 48, 0.10); }
    .layout-item.rect { border-radius: 15px; }
    .layout-item.circle { border-radius: 50%; }
    .layout-item.follow-readonly { cursor: default; }
    
    .layout-item.shape-item {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px;
      font-weight: 700;
      font-size: clamp(10px, 1.5vw, 24px);
      word-break: break-word;
      line-height: 1.2;
      font-family: var(--font-display);
    }

    .meeting-content {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100%;
      min-height: 0;
      text-align: center;
      width: 100%;
    }

    .meeting-title {
      padding: 3px 8px;
      background: linear-gradient(180deg, var(--blue), var(--blue-dim));
      color: #fff;
      font-family: var(--font-display);
      font-size: clamp(11px, 12cqh, 30px);
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meeting-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 1px 6px;
      min-height: 0;
      overflow: hidden;
    }

    .mini-label {
      color: var(--gray-dim);
      font-family: var(--font-mono);
      font-size: clamp(9px, 7.5cqh, 24px);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1;
    }

    .meeting-time {
      width: 100%;
      font-family: var(--font-mono);
      font-size: clamp(15px, 25cqh, 76px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: visible;
      transition: color 0.2s ease;
    }

    .meeting-company {
      width: 100%;
      color: var(--white);
      font-family: var(--font-display);
      font-size: clamp(12px, 16cqh, 48px);
      line-height: 1.1;
      font-weight: 700;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
      min-height: 1.05em;
    }

    .meeting-queue-preview {
      width: 100%;
      margin-top: 3px;
      border-top: 1px solid var(--border-soft);
      padding-top: 3px;
      min-height: 0;
      overflow: hidden;
    }

    .meeting-queue-preview ol {
      margin: 2px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      /* Satır bloğu kart içinde yatay olarak ortalanır; satırların
         kendi içinde numara ve isim hizalı kalır. */
      justify-content: center;
      gap: 0;
    }

    .meeting-queue-preview li {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 4px;
      color: var(--yellow);
      font-family: var(--font-body);
      font-size: clamp(8px, 5cqh, 18px);
      font-weight: 700;
      line-height: 1.05;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }

    .meeting-queue-preview li span {
      color: rgba(181, 121, 14, 0.8);
      font-variant-numeric: tabular-nums;
    }

    .meeting-queue-preview li.empty-queue {
      display: block;
      text-align: center;
      color: var(--gray-dim);
      font-style: italic;
    }

    .meeting-meta {
      display: flex;
      justify-content: center;
      padding: 3px 7px 4px;
      color: var(--gray);
      font-size: clamp(9px, 4.5cqh, 17px);
      border-top: 1px solid var(--border-soft);
      background: var(--card-alt);
      overflow: hidden;
    }

    .meeting-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .follow .meeting-meta { display: none; }
    .follow .meeting-time { font-size: clamp(16px, 23cqh, 72px); }
    .follow .meeting-company { font-size: clamp(12px, 12cqh, 34px); }
    .follow .meeting-queue-preview li { font-size: clamp(12px, 6cqh, 24px); } 

    /* Container Queries - Layout adjustments for scaling down */
    @container table-item (max-height: 130px) {
      .meeting-queue-preview .mini-label { display: none; }
    }
    @container table-item (max-height: 108px) {
      .meeting-queue-preview { display: none; }
      .mini-label { display: none; }
    }
    @container table-item (max-height: 76px) {
      .meeting-meta { display: none; }
    }

    .selected-panel {
      position: sticky;
      top: 12px;
      max-height: calc(100vh - 24px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .selected-panel .panel-body {
      display: flex;
      flex-direction: column;
      gap: 13px;
      overflow-y: auto;
    }
    .selected-panel .panel-body > * { flex: 0 0 auto; }

    .participants-tools { display: grid; gap: 10px; }
    .participants-panel-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .participants-panel-body > * { flex: 0 0 auto; }

    .participants-panel-body .add-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }
    .participants-panel-body .sheet { max-height: 360px; }

    .participants-tools .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .collapsible {
      border: 1px solid var(--border-soft);
      border-radius: 9px;
      background: var(--card-alt);
    }
    .collapsible > summary {
      cursor: pointer;
      padding: 8px 11px;
      color: var(--gray);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      list-style: none;
      user-select: none;
    }
    .collapsible > summary::-webkit-details-marker { display: none; }
    .collapsible > summary::before { content: '▸ '; color: var(--blue); }
    .collapsible[open] > summary::before { content: '▾ '; }
    .collapsible > summary:hover { color: var(--white); }
    .collapsible-body { display: grid; gap: 8px; padding: 0 11px 11px; }

    .sheet {
      margin-top: 0;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      overflow: auto;
      background: var(--card-alt);
      max-height: 200px;
      flex: none;
    }

    .sheet-head {
      position: sticky;
      top: 0;
      z-index: 1;
      border-radius: 9px 9px 0 0;
      display: grid;
      grid-template-columns: 34px 62px 1fr 66px;
      background: var(--header);
      color: var(--gray-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-soft);
    }

    .sheet-head div { padding: 7px 8px; border-right: 1px solid var(--border); }
    .sheet-head div:last-child { border-right: 0; }

    .participant-cell {
      display: grid;
      grid-template-columns: 34px 62px 1fr 66px;
      min-height: 34px;
      align-items: center;
      border-bottom: 1px solid var(--border-soft);
      color: var(--white);
      cursor: grab;
      transition: background 0.1s ease;
    }

    .participant-cell:hover { background: rgba(52, 87, 213, 0.05); }
    .participant-cell:active { cursor: grabbing; }
    /* Sol sütun: katılımcının tahmini görüşme saati */
    /* Sabit (Excel'den gelen) saat koyu ve dolgulu; otomatik hesaplanan
       saat soluk gösterilir, böylece hangisinin sabit olduğu anlaşılır. */
    /* Onay kutusu sütunu ve seçili satır vurgusu */
    .sheet-head .head-check,
    .participant-cell .row-check {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      padding: 0 4px;
      border-right: 1px solid var(--border-soft);
    }
    .sheet-head .head-check { background: var(--header); }
    .participant-cell .row-check input,
    .sheet-head .head-check input {
      width: 15px; height: 15px; margin: 0; cursor: pointer; accent-color: var(--blue);
    }
    .participant-cell.picked { background: rgba(52, 87, 213, 0.08); }
    .participant-cell.picked:hover { background: rgba(52, 87, 213, 0.12); }

    /* Toplu aktarma çubuğu */
    .bulk-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid var(--blue);
      border-radius: 9px;
      background: rgba(52, 87, 213, 0.07);
    }
    .bulk-count {
      color: var(--blue);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .bulk-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .bulk-hint { color: var(--gray); font-size: 12px; font-style: italic; }

    .participant-cell .slot-time.fixed { color: var(--blue); font-weight: 700; }
    .participant-cell .slot-time:not(.fixed) { color: var(--gray-dim); font-weight: 500; }
    .participant-cell .slot-time:hover { background: rgba(52, 87, 213, 0.12); }

    .participant-cell .slot-time {
      cursor: pointer;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px 6px;
      color: var(--blue);
      background: var(--header);
      border-right: 1px solid var(--border-soft);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Sürükleyerek sıralama sırasında bırakma konumu göstergesi */
    .participant-cell.drop-above { box-shadow: inset 0 3px 0 0 var(--blue); }
    .participant-cell.drop-below { box-shadow: inset 0 -3px 0 0 var(--blue); }

    .participant-cell .cell-value {
      padding: 7px 9px;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.3;
      font-weight: 600;
      font-size: 13px;
    }

    .participant-cell .ops {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 5px 6px 5px 0;
    }

    /* --- Tüm Masa Sıraları tablosu --- */
    .overview-queues {
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      overflow: auto;
      background: var(--card-alt);
      max-height: 340px;
    }

    .oq-row {
      display: grid;
      grid-template-columns: 76px repeat(var(--oq-cols), minmax(130px, 1fr));
      border-bottom: 1px solid var(--border-soft);
    }
    .oq-row:last-child { border-bottom: 0; }

    .oq-header {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--header);
    }

    .oq-cell {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      padding: 7px 9px;
      border-right: 1px solid var(--border-soft);
      font-size: 12.5px;
    }
    .oq-cell:last-child { border-right: 0; }

    .oq-head {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12.5px;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .oq-label {
      justify-content: flex-end;
      background: var(--header);
      color: var(--gray-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .oq-clock.fixed { color: var(--blue); }
    .oq-clock:not(.fixed) { color: var(--gray-dim); font-weight: 500; }

    .oq-clock {
      flex: none;
      color: var(--blue);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .oq-name {
      min-width: 0;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .oq-now { background: rgba(52, 87, 213, 0.07); }
    .oq-now .oq-name { color: var(--blue); font-weight: 700; }
    .oq-empty { color: var(--gray-dim); }

    .sheet.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray);
      padding: 28px;
      text-align: center;
      font-size: 13px;
    }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .form-grid .span { grid-column: 1 / -1; }
    .button-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .button-grid .wide { grid-column: 1 / -1; }
    .button-row-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

    .section-label {
      display: flex;
      align-items: center;

    /* Butonlar sığmazsa alt satıra sarar; taşma olmaz. */
    .modal-box.wide { width: min(620px, 100%); }

    /* --- Plan paylaşım penceresi --- */
    .share-step {

    .share-step.primary { border-color: var(--blue); background: rgba(52, 87, 213, 0.06); }

    .modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 18px 18px; }

    @media (max-width: 780px) {

      .selected-panel .panel-body { overflow-y: visible; }
      .sheet { max-height: 320px; }
      .hall-canvas { min-height: 460px; }
    }

    @media (max-width: 780px) {
      .app-shell { width: min(100% - 20px, 1760px); padding-top: 14px; }
      .topbar { flex-direction: column; }
      .top-actions { justify-content: stretch; width: 100%; }
      .top-actions button { flex: 1 1 auto; }

</head>
<body>
  <div id="app"></div>
  <div id="modalRoot"></div>
  <script>
    const STORAGE_KEY = 'b2b_state';
    const DEFAULT_SECONDS = 15 * 60;
    const SNAP_STEP = 2;
    const MEETING_AUTO_AREA = { x: 6, y: 6, w: 88, h: 88 };

    let state = loadState(true);
    let selectedId = state.selectedId || firstTableId();
    let tickTimer = null;
    let followPollTimer = null;
    let titleBlinkTimer = null;
    let originalTitle = document.title;
    let titleBlinkOn = false;
    let draggingLayout = null;
    let isEditMode = false;
    // Katılımcı sütununda toplu aktarma için işaretlenen satırlar.
    // Kalıcı değildir; sayfa yenilenince temizlenir.
    let selectedParticipantIds = new Set();

    function closeModal() {
      const overlay = document.getElementById('modalOverlay');
      if (overlay) overlay.remove();
      document.removeEventListener('keydown', modalKeydownHandler);
    }

    function modalKeydownHandler(event) {
      if (event.key === 'Escape') closeModal();
    }

    function openModal(options) {
      const {
        title = '', message = '', showInput = false, inputValue = '', inputPlaceholder = '',
        confirmText = 'TAMAM', cancelText = 'VAZGEÇ', danger = false, alertOnly = false, onConfirm = null,
        extraButtons = [], bodyHtml = '', onOpen = null, wide = false
      } = options || {};

      closeModal();
      const root = document.getElementById('modalRoot');
      if (!root) return;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'modalOverlay';
      overlay.innerHTML = `
        <div class="modal-box${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
          <div class="modal-header"><h3>${escapeHtml(title)}</h3></div>
          <div class="modal-body">
            ${message ? `<p>${escapeHtml(message)}</p>` : ''}
            ${showInput ? `<input id="modalInput" type="text" value="${escapeHtml(inputValue)}" placeholder="${escapeHtml(inputPlaceholder)}" autocomplete="off" />` : ''}
            ${bodyHtml}
          </div>
          <div class="modal-actions">
            ${extraButtons.map((b, i) => `<button type="button" class="${b.className || 'secondary'}" data-extra="${i}">${escapeHtml(b.label)}</button>`).join('')}
            ${alertOnly ? '' : `<button type="button" class="ghost" id="modalCancel">${escapeHtml(cancelText)}</button>`}
            <button type="button" class="${danger ? 'red' : ''}" id="modalConfirm">${escapeHtml(confirmText)}</button>
          </div>
        </div>
      `;
      root.appendChild(overlay);

      overlay.addEventListener('mousedown', (event) => { if (event.target === overlay) closeModal(); });

      const confirmBtn = document.getElementById('modalConfirm');
      const cancelBtn = document.getElementById('modalCancel');
      const input = document.getElementById('modalInput');

      confirmBtn.addEventListener('click', () => {
        const value = input ? input.value : true;
        closeModal();
        if (onConfirm) onConfirm(value);
      });
      if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

      overlay.querySelectorAll('[data-extra]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const tanim = extraButtons[Number(btn.dataset.extra)];
          closeModal();
          if (tanim && typeof tanim.onClick === 'function') tanim.onClick();
        });
      });

      document.addEventListener('keydown', modalKeydownHandler);

      if (input) {
        input.addEventListener('keydown', (event) => { if (event.key === 'Enter') confirmBtn.click(); });
        setTimeout(() => { input.focus(); input.select(); }, 0);
      } else {
        setTimeout(() => confirmBtn.focus(), 0);
      }

      if (typeof onOpen === 'function') onOpen(overlay);
    }

    function makeId(prefix) { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`; }
    function clone(value) { return JSON.parse(JSON.stringify(value)); }

    function getMeetingGrid(count) {
      const c = Math.max(1, Number(count) || 1);
      const ratio = MEETING_AUTO_AREA.w / MEETING_AUTO_AREA.h;
      const columns = Math.max(1, Math.ceil(Math.sqrt(c * ratio)));
      const rows = Math.max(1, Math.ceil(c / columns));
      return { columns, rows };
    }

    function getAutoMeetingSize(count) {
      const c = Math.max(1, Number(count) || 1);
      const { columns, rows } = getMeetingGrid(c);
      const gap = 2;
      const tiers = [
        { max: 2, w: 40, h: 33 }, { max: 4, w: 33, h: 28 }, { max: 6, w: 28, h: 24 },
        { max: 9, w: 24, h: 21 }, { max: 12, w: 21, h: 18 }, { max: 16, w: 18, h: 15 },
        { max: Infinity, w: 15, h: 13 }
      ];
      const tier = tiers.find(item => c <= item.max);
      const maxW = (MEETING_AUTO_AREA.w - gap * (columns + 1)) / columns;
      const maxH = (MEETING_AUTO_AREA.h - gap * (rows + 1)) / rows;
      const w = Math.max(7, Math.min(tier.w, maxW));
      const h = Math.max(6, Math.min(tier.h, maxH));
      return { w: Math.round(w * 10) / 10, h: Math.round(h * 10) / 10 };
    }

    function getAutoMeetingPosition(index, count) {
      const c = Math.max(1, Number(count) || 1);
      const { columns, rows } = getMeetingGrid(c);
      const size = getAutoMeetingSize(c);
      const col = index % columns;
      const row = Math.floor(index / columns);
      const cellW = MEETING_AUTO_AREA.w / columns;
      const cellH = MEETING_AUTO_AREA.h / rows;
      const x = snap(MEETING_AUTO_AREA.x + col * cellW + Math.max(0, (cellW - size.w) / 2));
      const y = snap(MEETING_AUTO_AREA.y + row * cellH + Math.max(0, (cellH - size.h) / 2));
      return {
        x: clampPercent(x, MEETING_AUTO_AREA.x, MEETING_AUTO_AREA.x, MEETING_AUTO_AREA.x + MEETING_AUTO_AREA.w - size.w),
        y: clampPercent(y, MEETING_AUTO_AREA.y, MEETING_AUTO_AREA.y, MEETING_AUTO_AREA.y + MEETING_AUTO_AREA.h - size.h)
      };
    }

    function applyAutoMeetingSizing(currentState = state) {
      if (!currentState || !Array.isArray(currentState.tables)) return;
      const meetings = currentState.tables.filter(table => table.kind === 'meeting');
      const meetingCount = meetings.length;
      if (!meetingCount) return;
      const size = getAutoMeetingSize(meetingCount);

      const needsRelayout = currentState.layoutCount !== meetingCount;

      meetings.forEach((table, index) => {
        table.w = size.w;
        table.h = size.h;
        if (needsRelayout) {
          const position = getAutoMeetingPosition(index, meetingCount);
          table.x = position.x;
          table.y = position.y;
        }
        table.x = clampPercent(Number(table.x), MEETING_AUTO_AREA.x, MEETING_AUTO_AREA.x, MEETING_AUTO_AREA.x + MEETING_AUTO_AREA.w - table.w);
        table.y = clampPercent(Number(table.y), MEETING_AUTO_AREA.y, MEETING_AUTO_AREA.y, MEETING_AUTO_AREA.y + MEETING_AUTO_AREA.h - table.h);
      });

      currentState.layoutCount = meetingCount;
    }

    function defaultState() {
      return {
        version: 3, selectedId: 'm1', participants: [], startTime: '09:00', fixedClocks: {},
        tables: [
          {
            id: 'm1', kind: 'meeting', title: 'MASA - 1', shape: 'rect',
            x: 20, y: 38, w: 22, h: 19, onceki: '', firma: '', saniye: DEFAULT_SECONDS,
            running: false, duration: 15, updatedAt: Date.now(), queue: []
          },
          {
            id: 'm2', kind: 'meeting', title: 'MASA - 2', shape: 'rect',
            x: 58, y: 38, w: 22, h: 19, onceki: '', firma: '', saniye: DEFAULT_SECONDS,
            running: false, duration: 15, updatedAt: Date.now(), queue: []
          }
        ]
      };
    }

    function migrateLegacy(raw) {
      const fallback = defaultState();
      if (!raw || typeof raw !== 'object') return fallback;
      if (Array.isArray(raw.tables)) return raw;

      const tables = [];
      ['m1', 'm2'].forEach((id, index) => {
        const legacy = raw[id] || {};
        const fb = fallback.tables[index];
        const queue = [];
        if (typeof legacy.siradaki === 'string' && legacy.siradaki.trim()) queue.push(legacy.siradaki.trim());
        tables.push({
          ...fb, onceki: typeof legacy.onceki === 'string' ? legacy.onceki : fb.onceki,
          firma: typeof legacy.firma === 'string' ? legacy.firma : fb.firma,
          saniye: Number.isFinite(Number(legacy.saniye)) ? Math.floor(Number(legacy.saniye)) : fb.saniye,
          running: Boolean(legacy.running),
          duration: Number.isFinite(Number(legacy.saniye)) ? Math.max(1, Math.ceil(Math.abs(Number(legacy.saniye)) / 60) || 15) : 15,
          updatedAt: Date.now(), queue
        });
      });
      return { version: 3, selectedId: 'm1', participants: [], tables };
    }

    function normalizeParticipant(item) {
      if (typeof item === 'string') return { id: makeId('p'), name: item.trim(), clock: null };
      return {
        id: typeof item?.id === 'string' ? item.id : makeId('p'),
        name: typeof item?.name === 'string' ? item.name.trim() : '',
        // Excel'den gelen sabit görüşme saati; yoksa sıraya göre hesaplanır.
        clock: /^\d{2}:\d{2}$/.test(String(item?.clock || '')) ? item.clock : null
      };
    }

    function normalizeMeeting(table, fallback, index) {
      const seconds = Number.isFinite(Number(table?.saniye)) ? Math.floor(Number(table.saniye)) : fallback.saniye;
      const duration = Number.isFinite(Number(table?.duration)) ? Math.max(1, Number(table.duration)) : Math.max(1, Math.ceil(Math.abs(seconds) / 60) || 15);
      const queue = Array.isArray(table?.queue) ? table.queue.map(String).map(v => v.trim()).filter(Boolean) : [];
      if (typeof table?.siradaki === 'string' && table.siradaki.trim() && !queue.includes(table.siradaki.trim())) {
        queue.push(table.siradaki.trim());
      }
      return {
        id: typeof table?.id === 'string' ? table.id : makeId('m'),
        kind: 'meeting', title: typeof table?.title === 'string' && table.title.trim() ? table.title.trim() : `MASA - ${index + 1}`,
        shape: 'rect', x: clampPercent(Number(table?.x), fallback.x, 0, 100 - fallback.w),
        y: clampPercent(Number(table?.y), fallback.y, 0, 100 - fallback.h), w: clampPercent(Number(table?.w), fallback.w, 8, 46),
        h: clampPercent(Number(table?.h), fallback.h, 8, 36), onceki: typeof table?.onceki === 'string' ? table.onceki : '',
        firma: typeof table?.firma === 'string' ? table.firma : '', saniye: seconds, running: Boolean(table?.running),
        duration, updatedAt: Number.isFinite(Number(table?.updatedAt)) ? Number(table.updatedAt) : Date.now(), queue
      };
    }

    function normalizeState(raw) {
      const migrated = migrateLegacy(raw);
      const fallback = defaultState();
      const tables = [];

      (Array.isArray(migrated.tables) ? migrated.tables : []).forEach((table, index) => {
        if (table?.kind === 'shape') {
          tables.push({
            id: typeof table.id === 'string' ? table.id : makeId('s'), kind: 'shape', shape: table.shape === 'circle' ? 'circle' : 'rect',
            text: typeof table.text === 'string' ? table.text : 'Yeni Alan',
            bgColor: typeof table.bgColor === 'string' ? table.bgColor : '#E6EAF2', textColor: typeof table.textColor === 'string' ? table.textColor : '#1B2230',
            x: clampPercent(Number(table.x), 10 + (index * 5) % 50, 0, 90), y: clampPercent(Number(table.y), 10 + (index * 5) % 50, 0, 90),
            w: clampPercent(Number(table.w), 12, 2, 100), h: clampPercent(Number(table.h), 8, 2, 100),
          });
          return;
        }
        if (table?.kind === 'note') return;
        const fb = fallback.tables[index] || { ...fallback.tables[0], id: makeId('m'), title: `MASA - ${index + 1}`, x: 10 + ((index * 18) % 70), y: 34 + (Math.floor(index / 4) * 22) };
        tables.push(normalizeMeeting(table, fb, index));
      });

      // Salon bilinçli olarak boşaltılmış olabilir (yerleşimi sıfırlama).
      // Bu yüzden masa yoksa varsayılanlar geri eklenmez; yalnızca hiç
      // kayıt yokken defaultState devreye girer.
      const participants = (Array.isArray(migrated.participants) ? migrated.participants : []).map(normalizeParticipant).filter(p => p.name);
      const selected = typeof migrated.selectedId === 'string' && tables.some(t => t.id === migrated.selectedId) ? migrated.selectedId : tables[0]?.id;

      const layoutCount = Number.isFinite(Number(migrated.layoutCount)) ? Number(migrated.layoutCount) : undefined;
      const startTime = /^\d{2}:\d{2}$/.test(String(migrated.startTime || '')) ? migrated.startTime : '09:00';
      // Firma adına bağlı sabit görüşme saatleri; katılımcı masaya
      // taşındıktan sonra da saatinin korunmasını sağlar.
      const fixedClocks = {};
      const hamSaatler = migrated.fixedClocks;
      if (hamSaatler && typeof hamSaatler === 'object') {
        Object.keys(hamSaatler).forEach(ad => {
          if (/^\d{2}:\d{2}$/.test(String(hamSaatler[ad] || ''))) fixedClocks[ad] = hamSaatler[ad];
        });
      }
      participants.forEach(p => { if (p.clock) fixedClocks[p.name] = p.clock; });
      const normalizedState = { version: 3, selectedId: selected, participants, tables, layoutCount, startTime, fixedClocks };
      applyAutoMeetingSizing(normalizedState);
      return normalizedState;
    }

    function clampPercent(value, fallback, min, max) { return Math.min(max, Math.max(min, Number.isFinite(value) ? value : fallback)); }

    function materializeTimers(currentState) {
      const now = Date.now();
      let changed = false;
      currentState.tables.forEach((table) => {
        if (table.kind !== 'meeting' || !table.running) return;
        const updatedAt = Number.isFinite(Number(table.updatedAt)) ? Number(table.updatedAt) : now;
        const elapsed = Math.floor((now - updatedAt) / 1000);
        if (elapsed > 0) {
          table.saniye -= elapsed;
          table.updatedAt = updatedAt + elapsed * 1000;
          changed = true;
        }
      });
      return changed;
    }

    function loadState(persistMaterialized = false) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const normalized = raw ? normalizeState(JSON.parse(raw)) : defaultState();
        const changed = materializeTimers(normalized);
        if (!raw || (changed && persistMaterialized)) writeState(normalized);
        return normalized;
      } catch (error) {
        const initialState = defaultState();
        try { writeState(initialState); } catch (e) { /* depolama yok */ }
        return initialState;
      }
    }

    function writeState(nextState = state) {
      applyAutoMeetingSizing(nextState);
      // Gizli sekme veya depolama izni kapalıysa setItem hata fırlatır.
      // Bu durumda uygulama bellekte çalışmayı sürdürür, sadece kayıt olmaz.
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
      } catch (error) {
        if (!writeState.uyarildi) {
          writeState.uyarildi = true;
          console.warn('Tarayıcı yerel kayda izin vermiyor; veriler bu sekme kapanınca silinir.');
        }
      }
    }

    function saveState() {
      materializeTimers(state);
      if (!state.tables.some(t => t.id === selectedId)) selectedId = firstTableId();
      state.selectedId = selectedId;
      writeState(state);
    }

    function firstTableId() { return state?.tables?.[0]?.id || null; }
    function getRoute() { return window.location.hash.toLowerCase() === '#takip' ? 'takip' : 'kontrol'; }

    function escapeHtml(value) {
      return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    function displayValue(value) {
      const text = String(value ?? '').trim();
      return text ? escapeHtml(text) : '<span class="empty-text">—</span>';
    }

    function renderQueuePreview(table) {
      const items = Array.isArray(table?.queue) ? table.queue.slice(0, 3) : [];
      if (!items.length) return '<li class="empty-queue">Sırada firma yok</li>';
      return items.map((name, index) => `<li title="${escapeHtml(name)}"><span>${index + 1}</span>${escapeHtml(name)}</li>`).join('');
    }

    /* ------------------------------------------------------------
       GÖRÜŞME SAATİ HESABI
       Etkinlik "tur" mantığıyla ilerler: N toplantı masası varsa her
       turda N firma aynı anda görüşür. Bir turun uzunluğu masanın
       görüşme süresidir. Buradaki saatler bu varsayıma göre hesaplanan
       tahmini saatlerdir.
       ------------------------------------------------------------ */
    function getStartMinutes() {
      const parts = String(state?.startTime || '09:00').split(':');
      const h = Number(parts[0]), m = Number(parts[1]);
      if (!Number.isFinite(h) || !Number.isFinite(m)) return 9 * 60;
      return h * 60 + m;
    }

    function formatClock(totalMinutes) {
      const wrapped = ((Math.round(totalMinutes) % 1440) + 1440) % 1440;
      const h = Math.floor(wrapped / 60);
      const m = wrapped % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function getMeetingTables() {
      return state.tables.filter(t => t.kind === 'meeting');
    }

    // Bir masadaki belirli tur numarasının başlangıç saati.
    // tur 0 = masada şu an görüşülen firma.
    // Firma için Excel'den gelen sabit saat varsa onu, yoksa null döner.
    function getFixedClock(name) {
      const ad = String(name || '').trim();
      return (ad && state.fixedClocks && state.fixedClocks[ad]) || null;
    }

    function getTableSlotClock(table, round) {
      return formatClock(getStartMinutes() + round * (Number(table.duration) || 15));
    }

    // Katılımcı sütunundaki bir kişinin tahmini görüşme saati.
    // Sütundakiler, masalardaki mevcut sıralar bittikten sonra
    // tur tur dağıtılır.
    function getParticipantClock(index) {
      const tables = getMeetingTables();
      const tableCount = tables.length || 1;
      const busiestQueue = tables.reduce((max, t) => Math.max(max, t.queue.length), 0);
      const referenceDuration = Number(tables[0]?.duration) || 15;
      const round = busiestQueue + 1 + Math.floor(index / tableCount);
      return formatClock(getStartMinutes() + round * referenceDuration);
    }

    function formatTime(totalSeconds) {
      const numeric = Math.floor(Number(totalSeconds) || 0);
      const sign = numeric < 0 ? '-' : '';
      const abs = Math.abs(numeric);
      return `${sign}${String(Math.floor(abs / 60)).padStart(2, '0')}:${String(abs % 60).padStart(2, '0')}`;
    }

    function getTimeColor(seconds) {
      const value = Number(seconds) || 0;
      if (value > 180) return '#3FB950';
      if (value >= 60) return '#D29922';
      return '#F85149';
    }

    function renderLayoutItem(table, mode) {
      const isFollow = mode === 'follow';
      const selected = !isFollow && table.id === selectedId;
      const clickAttr = (!isFollow && (isEditMode || table.kind === 'meeting')) ? `onclick="selectTable('${table.id}')"` : '';

      if (table.kind === 'shape') {
        const style = `left:${table.x}%;top:${table.y}%;width:${table.w}%;height:${table.h}%;background-color:${table.bgColor};color:${table.textColor};`;
        const common = `data-table-id="${escapeHtml(table.id)}" class="layout-item shape-item ${table.shape} ${selected ? 'selected' : ''} ${isFollow ? 'follow-readonly' : ''}" style="${style}"`;
        return `
          <div ${common} ${clickAttr}>
            ${escapeHtml(table.text)}
          </div>
        `;
      }

      /* Takip ekranındaki kartlarda ek olarak "sıradaki firmalar"
         bloğu bulunur; bu blok sığsın diye kart, ızgara hücresi
         içinde kalacak şekilde dikeyde büyütülür ve merkezde tutulur.
         Kontrol panelinde kart geometrisi olduğu gibi kalır. */
      let top = table.y;
      let height = table.h;
      if (isFollow) {
        const count = getMeetingTables().length || 1;
        const cellH = MEETING_AUTO_AREA.h / getMeetingGrid(count).rows;
        height = Math.min(table.h * 1.45, cellH * 0.94);
        top = Math.max(MEETING_AUTO_AREA.y, table.y - (height - table.h) / 2);
        const maxTop = MEETING_AUTO_AREA.y + MEETING_AUTO_AREA.h - height;
        top = Math.min(top, maxTop);
      }

      const style = `left:${table.x}%;top:${top}%;width:${table.w}%;height:${height}%;`;
      const common = `data-table-id="${escapeHtml(table.id)}" class="layout-item meeting-item ${table.shape} ${selected ? 'selected' : ''} ${isFollow ? 'follow-readonly' : ''}" style="${style}"`;
      const dropAttrs = !isFollow ? `ondragenter="markDropReady(event, '${table.id}')" ondragleave="unmarkDropReady(event, '${table.id}')" ondragover="allowTableDrop(event)" ondrop="dropParticipantToTable(event, '${table.id}')"` : '';

      const color = getTimeColor(table.saniye);
      const queuePreview = isFollow ? `
              <div class="meeting-queue-preview">
                <div class="mini-label">SIRADAKİ FİRMALAR</div>
                <ol data-queue-preview-id="${escapeHtml(table.id)}">${renderQueuePreview(table)}</ol>
              </div>` : '';
      const meta = isFollow ? '' : `
            <div class="meeting-meta"><span>${escapeHtml(table.running ? 'Çalışıyor' : 'Durdu')}</span></div>`;

      return `
        <div ${common} ${clickAttr} ${dropAttrs}>
          <div class="meeting-content">
            <div class="meeting-title">${escapeHtml(table.title)}</div>
            <div class="meeting-main">
              <div class="mini-label">⏱ KALAN SÜRE</div>
              <div class="meeting-time" data-time-id="${escapeHtml(table.id)}" style="color:${color}">${formatTime(table.saniye)}</div>
              <div class="mini-label current-label">MEVCUT FİRMA</div>
              <div class="meeting-company" data-company-id="${escapeHtml(table.id)}">${displayValue(table.firma)}</div>${queuePreview}
            </div>${meta}
          </div>
        </div>
      `;
    }

                   title="${participant.clock ? 'Excel\'den alınan saat — değiştirmek için tıklayın' : 'Sıraya göre hesaplandı — sabitlemek için tıklayın'}"
                   onmousedown="event.stopPropagation()"
                   onclick="editParticipantClock('${participant.id}')">${participant.clock || getParticipantClock(index)}</div>
              <div class="cell-value" title="${escapeHtml(participant.name)}">${escapeHtml(participant.name)}</div>

    /* Tüm masaların sıralarını tek tabloda gösterir: her sütun bir masa,
       her satır bir tur (şu an görüşülen + sıradakiler). */
    function renderAllQueuesTable() {
      const tables = getMeetingTables();
      if (!tables.length) return '<div class="empty-note">Masa yok</div>';
      const maxRounds = tables.reduce((max, t) => Math.max(max, t.queue.length), 0) + 1;

      const head = tables.map(t => `<div class="oq-cell oq-head" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</div>`).join('');
      const rows = Array.from({ length: maxRounds }, (_, round) => {
        const label = round === 0 ? 'Şu an' : `${round}. sıra`;
        const cells = tables.map((t) => {
          const name = round === 0 ? String(t.firma || '').trim() : t.queue[round - 1];
          if (!name) return `<div class="oq-cell oq-empty">—</div>`;
          // Excel'den gelen sabit saat varsa o kullanılır, yoksa tura göre hesaplanır.
          const sabit = getFixedClock(name);
          const clock = sabit || getTableSlotClock(t, round);
          return `<div class="oq-cell${round === 0 ? ' oq-now' : ''}">
                    <span class="oq-clock${sabit ? ' fixed' : ''}">${clock}</span>
                    <span class="oq-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>
                  </div>`;
        }).join('');
        return `<div class="oq-row"><div class="oq-cell oq-label">${label}</div>${cells}</div>`;
      }).join('');

      return `
        <div class="overview-queues" style="--oq-cols:${tables.length}">
          <div class="oq-row oq-header"><div class="oq-cell oq-head oq-label">Tur</div>${head}</div>
          ${rows}
        </div>
      `;
    }

      const url = `${window.location.href.split('#')[0]}#takip`;
      let popup = null;
      try { popup = window.open(url, '_blank'); } catch (error) {}
      if (popup && !popup.closed) { try { popup.focus(); } catch (error) {} return; }
      openModal({
        title: 'Takip Ekranı',
        message: 'Tarayıcı yeni sekme açmayı engelledi. Takip ekranını bu sekmede açabilirsiniz.',

    /* Bir hücrenin saat olup olmadığını anlar ve HH:MM biçimine çevirir.
       Excel'in ürettiği "9:00", "09.00", "09:00:00", "9:00 AM" gibi
       yazımların hepsi kabul edilir. Saat değilse null döner. */
    function parseClockCell(value) {
      const ham = String(value || '').trim();
      if (!ham) return null;
      const m = ham.match(/^(\d{1,2})[:.](\d{2})(?::\d{2})?\s*(AM|PM|ÖÖ|ÖS)?$/i);
      if (!m) return null;
      let saat = Number(m[1]);
      const dakika = Number(m[2]);
      if (!Number.isFinite(saat) || !Number.isFinite(dakika) || dakika > 59) return null;
      const ek = (m[3] || '').toUpperCase();
      if (ek === 'PM' || ek === 'ÖS') { if (saat < 12) saat += 12; }
      if (ek === 'AM' || ek === 'ÖÖ') { if (saat === 12) saat = 0; }
      if (saat > 23) return null;
      return `${String(saat).padStart(2, '0')}:${String(dakika).padStart(2, '0')}`;
    }

    /* Excel'den yapıştırılan metni satır satır ayrıştırır.
       Bir satırda birden çok sütun varsa (tab / noktalı virgül / virgül),
       saat biçimindeki sütun görüşme saati, kalan metin katılımcı adı
       olarak alınır. Saat sütunu yoksa katılımcının saati boş kalır ve
       sırasına göre otomatik hesaplanır. */
    function parseParticipants(text) {
      return String(text || '')
        .split(/[\r\n]+/)
        .map(satir => {
          const hucreler = satir.split(/[\t;,]/).map(h => h.trim()).filter(Boolean);
          if (!hucreler.length) return null;

          let clock = null;
          const adParcalari = [];
          hucreler.forEach(hucre => {
            const saat = parseClockCell(hucre);
            if (saat && !clock) clock = saat;
            else adParcalari.push(hucre);
          });

          const name = adParcalari.join(' ').trim();
          if (!name) return null;
          return { name, clock };
        })
        .filter(Boolean);
    }

    function addParsedParticipants(kayitlar) {
      if (!kayitlar.length) return false;
      kayitlar.forEach(({ name, clock }) => {

      });

      return true;
    }

    /* Katılımcının sabit görüşme saatini düzenler. Boş bırakılırsa

    function editParticipantClock(id) {

          saveState(); renderControlPanel();
        }

    }

    /* Katılımcı sütununda sürükleyerek sıralama. Sürüklenen hücre,
       üzerine bırakıldığı hücrenin üst ya da alt yarısına göre o
       satırın önüne veya arkasına taşınır. */
    function allowParticipantReorder(event, index) {
      event.preventDefault();
      event.stopPropagation();
      const cell = event.currentTarget;
      const rect = cell.getBoundingClientRect();
      const altYariya = event.clientY > rect.top + rect.height / 2;
      document.querySelectorAll('.participant-cell').forEach(el => el.classList.remove('drop-above', 'drop-below'));
      cell.classList.add(altYariya ? 'drop-below' : 'drop-above');
    }

    function clearReorderMark(event) {
      event.currentTarget.classList.remove('drop-above', 'drop-below');
    }

    function dropParticipantReorder(event, targetIndex) {
      event.preventDefault();
      event.stopPropagation();
      document.querySelectorAll('.participant-cell').forEach(el => el.classList.remove('drop-above', 'drop-below'));

      const payload = readDragPayload(event);
      state = loadState(true);

      // Masa sırasından geri sürüklenmişse belirli konuma yerleştir.
      if (payload && payload.type === 'queue') {
        const name = consumeDraggedName(payload);
        if (!name) return;
        const rect = event.currentTarget.getBoundingClientRect();
        const yer = event.clientY > rect.top + rect.height / 2 ? targetIndex + 1 : targetIndex;
        state.participants.splice(yer, 0, { id: makeId('p'), name });
        saveState();
        renderControlPanel();
        return;
      }

      if (!payload || payload.type !== 'participant') return;
      const from = state.participants.findIndex(p => p.id === payload.participantId);
      if (from < 0) return;

      const rect = event.currentTarget.getBoundingClientRect();
      let to = event.clientY > rect.top + rect.height / 2 ? targetIndex + 1 : targetIndex;
      if (from < to) to -= 1;
      if (from === to) return;

      const [item] = state.participants.splice(from, 1);
      state.participants.splice(to, 0, item);
      saveState();
      renderControlPanel();
    }
    function dragQueueItem(event, tableId, index) { event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('application/json', JSON.stringify({ type: 'queue', tableId, index })); }
    function readDragPayload(event) { try { return JSON.parse(event.dataTransfer.getData('application/json') || 'null'); } catch (e) { return null; } }
    
    function allowTableDrop(event) { event.preventDefault(); }
    function allowQueueDrop(event) { event.preventDefault(); event.currentTarget.classList.add('drop-ready'); }
    function allowCanvasDrop(event) { event.preventDefault(); }
    function allowParticipantReturn(event) { event.preventDefault(); }
    function markDropReady(event, id) { event.preventDefault(); document.querySelector(`[data-table-id="${CSS.escape(id)}"]`)?.classList.add('drop-ready'); }
    function unmarkDropReady(event, id) { document.querySelector(`[data-table-id="${CSS.escape(id)}"]`)?.classList.remove('drop-ready'); }

    function consumeDraggedName(payload) {
      if (!payload) return '';
      if (payload.type === 'participant') {
        const idx = state.participants.findIndex(p => p.id === payload.participantId);
        if (idx < 0) return '';
        return state.participants.splice(idx, 1)[0].name;
      }
      if (payload.type === 'queue') {
        const src = getTable(payload.tableId);
        if (!src || src.kind !== 'meeting' || payload.index < 0 || payload.index >= src.queue.length) return '';
        return src.queue.splice(payload.index, 1)[0];
      }
      return '';
    }

    function bindLayoutDragging() {
      const canvas = document.getElementById('hallCanvas'); if (!canvas || getRoute() === 'takip') return;
      canvas.querySelectorAll('.layout-item').forEach((item) => {
        item.addEventListener('pointerdown', (event) => {
          if (event.button !== 0 || event.target.closest('button, input, textarea, select')) return;
          const id = item.dataset.tableId; const table = getTable(id); if (!table) return;
          if (table.kind === 'shape' && !isEditMode) return; 

          selectedId = id; state.selectedId = id; writeState(state);
          const rect = canvas.getBoundingClientRect(); const itemRect = item.getBoundingClientRect();
          draggingLayout = { id, canvas, rect, pointerOffsetX: event.clientX - itemRect.left, pointerOffsetY: event.clientY - itemRect.top };
          item.setPointerCapture(event.pointerId); item.classList.add('selected'); event.preventDefault();
        });

        item.addEventListener('pointermove', (event) => {
          if (!draggingLayout || draggingLayout.id !== item.dataset.tableId) return;
          const table = getTable(draggingLayout.id); if (!table) return;
          const { rect, pointerOffsetX, pointerOffsetY } = draggingLayout;
          let x = ((event.clientX - rect.left - pointerOffsetX) / rect.width) * 100;
          let y = ((event.clientY - rect.top - pointerOffsetY) / rect.height) * 100;
          if (table.kind === 'meeting') {
            x = snap(Math.min(MEETING_AUTO_AREA.x + MEETING_AUTO_AREA.w - table.w, Math.max(MEETING_AUTO_AREA.x, x)));
            y = snap(Math.min(MEETING_AUTO_AREA.y + MEETING_AUTO_AREA.h - table.h, Math.max(MEETING_AUTO_AREA.y, y)));
          } else {
            x = snap(Math.min(100 - table.w, Math.max(0, x)));
            y = snap(Math.min(100 - table.h, Math.max(0, y)));
          }
          item.style.left = `${x}%`; item.style.top = `${y}%`; table.x = x; table.y = y;
        });

        item.addEventListener('pointerup', (event) => {
          if (!draggingLayout || draggingLayout.id !== item.dataset.tableId) return;
          draggingLayout = null; try { item.releasePointerCapture(event.pointerId); } catch (e) {}
          saveState(); renderControlPanel();
        });

        item.addEventListener('pointercancel', () => {
          if (!draggingLayout || draggingLayout.id !== item.dataset.tableId) return;
          draggingLayout = null; saveState(); renderControlPanel();
        });
      });
    }

    function snap(value) { return Math.round(value / SNAP_STEP) * SNAP_STEP; }

        selectedTime.textContent = formatTime(table.saniye); selectedTime.style.color = getTimeColor(table.saniye);

    function startTicking() {
      if (tickTimer) return;
      tickTimer = setInterval(() => {
        const before = JSON.stringify(state.tables.filter(t => t.kind === 'meeting').map(t => [t.id, t.saniye, t.running, t.updatedAt]));
        state = loadState(true);
        const after = JSON.stringify(state.tables.filter(t => t.kind === 'meeting').map(t => [t.id, t.saniye, t.running, t.updatedAt]));
        if (before !== after) refreshDynamicDisplays();
      }, 500);

    function stopTicking() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

    function startFollowPolling() {
      if (followPollTimer) clearInterval(followPollTimer);
      followPollTimer = setInterval(() => {
        if (getRoute() !== 'takip') return;
        const prevSig = layoutSignature(state); state = loadState(true);
        if (prevSig !== layoutSignature(state)) renderFollowScreen(); else refreshDynamicDisplays();
      }, 500);
    }
    function stopFollowPolling() { if (followPollTimer) { clearInterval(followPollTimer); followPollTimer = null; } }

    function layoutSignature(currentState) {
      return JSON.stringify(currentState.tables.map(t => ({
        id: t.id, kind: t.kind, title: t.title, shape: t.shape, x: t.x, y: t.y, w: t.w, h: t.h,
        firma: t.firma, onceki: t.onceki, q: Array.isArray(t.queue) ? t.queue.slice(0, 3) : [], running: t.running
      })));
    }

    function isAnyDeskCritical() { return state.tables.some(t => t.kind === 'meeting' && Number(t.saniye) < 60); }
    function updateTitleBlink() {
      if (getRoute() !== 'takip' || !isAnyDeskCritical()) { stopTitleBlink(); return; }
      if (titleBlinkTimer) return;
      titleBlinkTimer = setInterval(() => { titleBlinkOn = !titleBlinkOn; document.title = titleBlinkOn ? '⚠ SÜRE KRİTİK' : originalTitle; }, 650);
    }
    function stopTitleBlink() { if (titleBlinkTimer) { clearInterval(titleBlinkTimer); titleBlinkTimer = null; } titleBlinkOn = false; document.title = originalTitle; }

    function resetAllConfirm() {
      openModal({ title: 'Sıfırla', message: 'Tüm salon planı, sıralar ve katılımcı sütunu varsayılana dönsün mü?', confirmText: 'SIFIRLA', danger: true, onConfirm: () => { state = defaultState(); selectedId = state.selectedId; writeState(state); route(); } });
    }

    /* Yalnızca salon yerleşimini sıfırlar: eklenen şekiller silinir,
       masalar varsayılan ızgara düzenine döner. Firma adları, sıralar,
       katılımcı sütunu ve saatler korunur. */
    function resetLayoutConfirm() {
      openModal({
        title: 'Yerleşimi Sıfırla',
        message: 'Salondaki tüm masalar ve şekiller silinecek. Katılımcı sütunu, saatler ve etkinlik ayarları korunur. Devam edilsin mi?',
        confirmText: 'YERLEŞİMİ SIFIRLA',
        danger: true,
        onConfirm: () => {
          state = loadState(true);
          state.tables = [];
          state.layoutCount = 0;
          selectedId = null;
          state.selectedId = null;
          isEditMode = true; // boş salonda hemen masa eklenebilsin
          saveState();
          renderControlPanel();
        }
      });
    }

    /* ============================================================
       PLAN PAYLAŞIMI
       Uygulamanın ortak sunucusu yoktur; veriler her tarayıcının
       kendi yerel deposunda durur. Planı başka bilgisayarda açmak
       için ya bir dosya olarak dışa aktarılır ya da tüm plan adresin
       içine kodlanmış bir bağlantı üretilir.
       ============================================================ */
    function encodePlan(planState) {
      const json = JSON.stringify(planState);
      const bytes = new TextEncoder().encode(json);
      let binary = '';
      bytes.forEach(b => { binary += String.fromCharCode(b); });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodePlan(encoded) {
      const normal = String(encoded).replace(/-/g, '+').replace(/_/g, '/');
      const binary = atob(normal);
      const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function buildShareLink() {
      return `${window.location.href.split('#')[0]}#plan=${encodePlan(state)}`;
    }

    function openShareDialog() {
      const link = buildShareLink();
      const cokUzun = link.length > 7000;

      openModal({
        title: 'Planı Başka Bilgisayarda Aç',
        wide: true,
        alertOnly: true,
        confirmText: 'KAPAT',
        bodyHtml: `
          <div class="share-step primary">
            <div class="share-step-title">Sayfayı planla birlikte indir (önerilen)</div>
            <p class="share-desc">
              Uygulamanın tamamını, şu anki planı içine gömülmüş hâlde tek bir HTML dosyası olarak indirir.
              Dosyayı diğer bilgisayara kopyalayıp çift tıklamanız yeterlidir — kurulum, sunucu veya
              internet gerekmez. Açıldığında tüm masalar, sıralar, katılımcılar ve saatler yerinde olur.
            </p>
            <div class="share-buttons">
              <button type="button" class="green" id="shareHtml">⬇ SAYFAYI PLANLA İNDİR (.html)</button>
              <span class="share-status" id="shareStatus"></span>
            </div>
          </div>

          <details class="collapsible share-more">
            <summary>Diğer yöntemler</summary>
            <div class="collapsible-body">
              <p class="share-desc">
                <strong>Plan dosyası (.json)</strong> — Yalnızca verileri taşır. Diğer bilgisayarda
                uygulama zaten kuruluysa "Yükle" ile içe aktarabilirsiniz.
              </p>
              <div class="share-buttons">
                <button type="button" class="secondary" id="shareDownload">PLAN DOSYASI İNDİR</button>
                <button type="button" class="secondary" id="shareUpload">PLAN DOSYASI YÜKLE</button>
              </div>

              <p class="share-desc" style="margin-top:12px">
                <strong>Bağlantı</strong> — Yalnızca uygulama bir web adresinde yayındaysa çalışır.
                ${cokUzun ? 'Planınız büyük olduğu için bu bağlantı çoğu tarayıcıda açılmayacaktır.' : 'Adresin tamamı kopyalanmalıdır.'}
              </p>
              <textarea id="shareLink" class="share-link" readonly rows="3">${escapeHtml(link)}</textarea>
              <div class="share-buttons">
                <button type="button" class="secondary" id="shareCopy">BAĞLANTIYI KOPYALA</button>
              </div>
            </div>
          </details>
        `,
        onOpen: () => {
          const durum = document.getElementById('shareStatus');
          const kutu = document.getElementById('shareLink');
          kutu?.addEventListener('focus', () => kutu.select());

          document.getElementById('shareHtml')?.addEventListener('click', () => {
            try {
              downloadStandalonePage();
              if (durum) { durum.textContent = 'Dosya indirildi.'; durum.className = 'share-status ok'; }
            } catch (error) {
              if (durum) { durum.textContent = 'İndirilemedi: ' + error.message; durum.className = 'share-status err'; }
            }
          });
          document.getElementById('shareDownload')?.addEventListener('click', downloadPlanFile);
          document.getElementById('shareUpload')?.addEventListener('click', () => { closeModal(); openPlanFilePicker(); });
          document.getElementById('shareCopy')?.addEventListener('click', () => {
            copyToClipboard(link, (ok) => { if (!ok) { kutu?.focus(); kutu?.select(); } });
          });
        }
      });
    }

    /* Panoya kopyalama. Güvenli olmayan (http) adreslerde
       navigator.clipboard bulunmaz; bu durumda eski yönteme düşer. */
    function copyToClipboard(text, sonuc) {
      const bitir = (ok) => { if (typeof sonuc === 'function') sonuc(ok); };

      if (navigator.clipboard?.writeText && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => bitir(true)).catch(() => bitir(eskiYontemleKopyala(text)));
        return;
      }
      bitir(eskiYontemleKopyala(text));
    }

    function eskiYontemleKopyala(text) {
      try {
        const alan = document.createElement('textarea');
        alan.value = text;
        alan.setAttribute('readonly', '');
        alan.style.position = 'fixed';
        alan.style.top = '-1000px';
        document.body.appendChild(alan);
        alan.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(alan);
        return ok;
      } catch (error) {
        return false;
      }
    }

    function indirDosya(icerik, dosyaAdi, tur) {
      const blob = new Blob([icerik], { type: tur });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = dosyaAdi;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /* Uygulamanın tamamını, o anki planı içine gömerek tek bir HTML
       dosyası olarak indirir. İnternet veya sunucu gerekmez; dosyayı
       herhangi bir bilgisayarda çift tıklayıp açmak yeterlidir.
       Sayfanın kendi kaynağı DOM'dan yeniden üretilir; çalışma anında
       oluşan içerik (çizilmiş arayüz, açık pencereler) temizlenir. */
    function buildStandalonePage() {
      const kopya = document.documentElement.cloneNode(true);

      // Çalışma anında doldurulan alanları boşalt
      const app = kopya.querySelector('#app');
      if (app) app.innerHTML = '';
      const modalRoot = kopya.querySelector('#modalRoot');
      if (modalRoot) modalRoot.innerHTML = '';

      // Önceki bir gömülü planı temizle (üst üste binmesin)
      kopya.querySelectorAll('script[data-embedded-plan]').forEach(el => el.remove());

      const damga = `${Date.now()}`;
      const gomulu = kopya.ownerDocument.createElement('script');
      gomulu.setAttribute('data-embedded-plan', damga);
      // Kapanış etiketi dizisi metin içinde kaçırılır, aksi halde script erken kapanır
      const govde = JSON.stringify({ stamp: damga, plan: state }).split('</').join('<\\/');
      gomulu.textContent = 'window.__GOMULU_PLAN__ = ' + govde + ';';
      // Ana betik body sonunda çalıştığı için gömülü plan head'e konur;
      // aksi halde uygulama başladığında plan henüz tanımlı olmaz.
      kopya.querySelector('head')?.appendChild(gomulu);

      return `<!DOCTYPE html>\n${kopya.outerHTML}`;
    }

    function downloadStandalonePage() {
      const damga = new Date().toISOString().slice(0, 10);
      indirDosya(buildStandalonePage(), `b2b-toplanti-plani-${damga}.html`, 'text/html;charset=utf-8');
    }

    function downloadPlanFile() {
      indirDosya(JSON.stringify(state, null, 2), `b2b-plan-${new Date().toISOString().slice(0, 10)}.json`, 'application/json');
    }

    /* İndirilen HTML dosyası ilk kez açıldığında içindeki planı yükler.
       Aynı dosya sonradan tekrar açıldığında kullanıcının o dosyada
       yaptığı değişiklikler korunur; gömülü plan yeniden yazılmaz. */
    function handleEmbeddedPlan() {
      const gomulu = window.__GOMULU_PLAN__;
      if (!gomulu || !gomulu.plan) return false;
      const anahtar = 'b2b_embedded_' + gomulu.stamp;
      try {
        if (localStorage.getItem(anahtar)) return false;
        localStorage.setItem(anahtar, '1');
      } catch (error) { /* depolama yoksa her açılışta gömülü plan yüklenir */ }

      state = normalizeState(gomulu.plan);
      selectedId = state.selectedId || firstTableId();
      writeState(state);
      return true;
    }

    function openPlanFilePicker() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.addEventListener('change', () => {
        const file = input.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try { applyImportedPlan(JSON.parse(String(reader.result))); }
          catch (error) { openModal({ title: 'Dosya Okunamadı', message: 'Seçilen dosya geçerli bir plan dosyası değil.', alertOnly: true }); }
        };
        reader.readAsText(file);
      });
      input.click();
    }

    function applyImportedPlan(raw) {
      openModal({
        title: 'Planı Yükle',
        message: 'Bu bilgisayardaki mevcut plan, yüklenen planla değiştirilecek. Devam edilsin mi?',
        confirmText: 'YÜKLE',
        danger: true,
        onConfirm: () => {
          state = normalizeState(raw);
          selectedId = state.selectedId || firstTableId();
          writeState(state);
          route();
        }
      });
    }

    function handleSharedPlanInUrl() {
      const hash = window.location.hash || '';
      if (!hash.startsWith('#plan=')) return false;
      let raw = null;
      try { raw = decodePlan(hash.slice(6)); } catch (error) { raw = null; }
      history.replaceState(null, '', window.location.href.split('#')[0]);
      if (!raw) {
        openModal({ title: 'Bağlantı Geçersiz', message: 'Paylaşılan plan okunamadı. Bağlantı eksik kopyalanmış olabilir.', alertOnly: true });
        return false;
      }
      state = normalizeState(raw);
      selectedId = state.selectedId || firstTableId();
      writeState(state);
      return true;
    }

    function route() {
      state = loadState(true); selectedId = state.selectedId || selectedId || firstTableId();
      stopFollowPolling();
      if (getRoute() === 'takip') renderFollowScreen(); else renderControlPanel();
    }

    window.addEventListener('storage', (event) => { if (event.key === STORAGE_KEY) route(); });
    window.addEventListener('hashchange', () => { handleSharedPlanInUrl(); route(); });
    window.addEventListener('beforeunload', () => { stopFollowPolling(); stopTitleBlink(); stopTicking(); });

    handleEmbeddedPlan();
    handleSharedPlanInUrl();
    route();
  </script>
</body>
</html>
